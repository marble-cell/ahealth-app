<style>
  :root { --blue: #0099FF; --ink: #1b2430; --sub: #6b7684; --bg: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 0 20px env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  main { flex: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .icon { width: 96px; height: 96px; margin-bottom: 28px; }
  h1 { font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: -0.02em; }
  h1 .hl { color: var(--blue); }
  p.sub { margin-top: 12px; font-size: 16px; color: var(--sub); }
  footer { width: 100%; max-width: 420px; padding: 16px 0 28px; }
  .btn {
    display: block; width: 100%; padding: 18px 0; border-radius: 14px;
    background: var(--blue); color: #fff; font-size: 18px; font-weight: 700;
    text-decoration: none; text-align: center;
  }
  .btn:active { opacity: .85; }
  .guide {
    display: none; margin-top: 14px; padding: 14px 16px; border-radius: 12px;
    background: #f2f4f6; color: var(--ink); font-size: 14px; line-height: 1.55; text-align: left;
  }
  .guide b { color: var(--blue); }
  .guide.show { display: block; }
</style>
